            <choice name="1080p" value="1080p" />
          </feature>
          <feature name="aspect ratio" value="ymir_aspect">
            <choice name="auto" value="auto" />
            <choice name="4:3" value="4:3" />
            <choice name="3:2" value="3:2" />
            <choice name="16:10" value="16:10" />
            <choice name="16:9" value="16:9" />
          </feature>
          <feature name="rotation" value="ymir_rotation">
            <choice name="normal" value="Normal" />
            <choice name="90 CW" value="90CW" />
            <choice name="180" value="180" />
            <choice name="90 CCW" value="90CCW" />
          </feature>
          <feature name="integer scaling" value="ymir_integer">
            <choice name="off" value="false" />
            <choice name="on" value="true" />
          </feature>
          <feature name="deinterlace" value="ymir_deinterlace">
            <choice name="off" value="false" />
            <choice name="on" value="true" />
          </feature>
          <feature name="transparent meshes" value="ymir_meshes">
            <choice name="off" value="false" />
            <choice name="on" value="true" />
          </feature>
        </features>
      </core>
